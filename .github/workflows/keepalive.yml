name: supabase-keepalive

# 免费版 Supabase 项目 7 天无 API 请求会被暂停。
# 每天打一次 /auth/v1/settings，保持项目处于活跃状态。
# 注意：GitHub 会在仓库连续 60 天无提交后停用定时任务，
# 届时到 Actions 页面点一次「Run workflow」即可恢复。

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase auth settings
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_L6Q3TQpuSwody0e9T1AdcQ_g1u1HPcn" \
            "https://vfkugnrvgcpptgquhucs.supabase.co/auth/v1/settings")
          echo "HTTP $code"
          test "$code" = "200"
